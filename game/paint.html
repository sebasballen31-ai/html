<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Paint</title>
        <link rel="shortcut icon" href="favicon.jpg" type="image/jpg" />
        <style>
            canvas {
                border: 1px solid rgb(17, 231, 99);
            }
            body {
                margin: 0px;
            }
        </style>
    </head>
    <body>
        <input type="color" id="colorPicker" value="#000000" />
        <input type="range" id="brushSize" min="1" max="100" value="5" />
        <button id="undoBtn"><style></style> ↩ Deshacer</button>
        <button id="redoBtn">↪ Rehacer</button>
        <button id="clearButton">Borrar</button>
        <button id="download">descargar imagen</button>
        <br /><br />
        <canvas id="paintcanvas" height="600"></canvas>
        <br />
        <script>
            const canvas = document.getElementById("paintcanvas");
            const context = canvas.getContext("2d");
            const colorPicker = document.getElementById("colorPicker");
            const brushSize = document.getElementById("brushSize");
            const clearButton = document.getElementById("clearButton");
            const download = document.getElementById("download");
            const resize = () => {
                canvas.width = window.innerWidth - 10;
                canvas.height = window.innerHeight - 80;
            };

            resize();

            window.addEventListener("resize", resize);

            let undoStack = [];
            let redoStack = [];
            let painting = false;
            let groupIndex = 0;
            const coordenadas = [];

            fetch("./data.json")
                .then(res => res.json())
                .then(data => {
                    for (const element of data) {
                        const color = element.color;
                        const size = element.size;
                        const coordenadas = element.coordenadas;
                        context.beginPath();

                        for (const coordenada of coordenadas) {
                            draw(coordenada.x, coordenada.y, color, size);
                        }
                    }
                });

            function startPosition(e) {
                if (e.which === 1 || e.which === 3) {
                    saveState();
                    groupIndex = coordenadas.length;
                    painting = true;
                    context.beginPath();
                    context.moveTo(
                        e.clientX - canvas.offsetLeft,
                        e.clientY - canvas.offsetTop
                    );
                }
            }

            function endPosition() {
                painting = false;
                context.beginPath();
            }

            function draw(x, y, color, size) {
                context.lineWidth = size;
                context.lineCap = "round";
                context.strokeStyle = color;
                context.lineTo(x - canvas.offsetLeft, y - canvas.offsetTop);
                context.stroke();
            }

            function drawEvent(e) {
                if (!painting) return;

                const leftClick = e.which === 1;
                const rightClick = e.which === 3;

                if (leftClick) {
                    coordenadas[groupIndex] ||= {
                        color: colorPicker.value,
                        size: brushSize.value,
                        coordenadas: [],
                    };
                    coordenadas[groupIndex].coordenadas.push({
                        x: e.clientX,
                        y: e.clientY,
                    });
                    draw(
                        e.clientX,
                        e.clientY,
                        colorPicker.value,
                        brushSize.value
                    );
                }

                if (rightClick) {
                    context.clearRect(
                        e.clientX - canvas.offsetLeft,
                        e.clientY - canvas.offsetTop,
                        brushSize.value,
                        brushSize.value
                    );
                }
            }

            function clearCanvas() {
                saveState();
                context.clearRect(0, 0, canvas.width, canvas.height);
            }
            function saveState() {
                undoStack.push(canvas.toDataURL());
                redoStack = [];
            }
            function restoreState(from, to) {
                if (from.length === 0) return;

                to.push(canvas.toDataURL());
                const img = new Image();
                img.src = from.pop();
                img.onload = () => {
                    context.clearRect(0, 0, canvas.width, canvas.height);
                    context.drawImage(img, 0, 0);
                };
            }

            canvas.addEventListener("mousedown", startPosition);
            canvas.addEventListener("mouseup", endPosition);
            canvas.addEventListener("contextmenu", e => e.preventDefault());
            canvas.addEventListener("mousedown", e => {
                if (e.which === 1) {
                    console.log("click izquierdo");
                }
                if (e.which === 2) {
                    console.log("click medio");
                }
                if (e.which === 3) {
                    console.log("click derecho");
                }
            });
            canvas.addEventListener("mousemove", drawEvent);
            clearButton.addEventListener("click", clearCanvas);
            document.addEventListener("keydown", e => {
                if (e.code === "KeyC" || e.code === "Backspace") {
                    const respuesta = confirm("Quieres limpiar tu dibujo?");
                    if (respuesta === true) {
                        clearCanvas();
                    }
                }
                if (e.ctrlKey && e.key === "z") {
                    restoreState(undoStack, redoStack);
                }
                if (e.ctrlKey && e.key === "y") {
                    restoreState(redoStack, undoStack);
                }
            });

            const undoBtn = document.getElementById("undoBtn");
            undoBtn.addEventListener("click", () => {
                restoreState(undoStack, redoStack);
            });
            const redoBtn = document.getElementById("redoBtn");
            redoBtn.addEventListener("click", () => {
                restoreState(redoStack, undoStack);
            });
            download.addEventListener("click", e => {
                const image_url = canvas.toDataURL("image/jpg");

                const a = document.createElement("a");
                a.href = image_url;
                a.download = 'dibujo.jpg';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            });
        </script>
    </body>
</html>
