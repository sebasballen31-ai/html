<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Paint</title>
        <link rel="shortcut icon" href="favicon.jpg" type="image/jpg" />
        <style>
            canvas {
                border: 1px solid rgb(17, 231, 99);
            }
            body {
                margin: 0px;
            }
        </style>
    </head>
    <body>
        <input type="color" id="colorPicker" value="#000000" />
        <input type="range" id="brushSize" min="1" max="100" value="5" />
        <button id="undoBtn">↩ Deshacer</button>
        <button id="redoBtn">↪ Rehacer</button>
        <button id="clearButton">Borrar</button>
        <button id="download">descargar imagen</button>
        <br /><br />
        <canvas id="paintcanvas" height="600"></canvas>
        <script type="module" src="src/index.js"></script>
    </body>
</html>
