<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Paint</title>
    <link rel="shortcut icon" href="favicon.jpg" type="image/jpg" />
    <style>
        canvas {
            border: 1px solid rgb(17, 231, 99);
        }
    </style>
</head>
<body>

<button id="undoBtn">↩ Deshacer</button>
<button id="redoBtn">↪ Rehacer</button>
<button id="clearButton">Borrar</button>
<br><br>

<canvas id="paintcanvas" width="800" height="600"></canvas>
<br>
<input type="color" id="colorPicker" value="#000000" />
<input type="range" id="brushSize" min="1" max="100" value="5" />

<script>
const canvas = document.getElementById("paintcanvas");
const context = canvas.getContext("2d");
const colorPicker = document.getElementById("colorPicker");
const brushSize = document.getElementById("brushSize");
const clearButton = document.getElementById("clearButton");
const undoBtn = document.getElementById("undoBtn");
const redoBtn = document.getElementById("redoBtn");

let undoStack = [];
let redoStack = [];
let painting = false;

// 🧠 GUARDAR ESTADO
function saveState() {
    undoStack.push(canvas.toDataURL());
    redoStack = [];
}

// 🔁 RESTAURAR ESTADO
function restoreState(from, to) {
    if (from.length === 0) return;

    to.push(canvas.toDataURL());
    const img = new Image();
    img.src = from.pop();
    img.onload = () => {
        context.clearRect(0, 0, canvas.width, canvas.height);
        context.drawImage(img, 0, 0);
    };
}

// BOTONES
undoBtn.onclick = () => restoreState(undoStack, redoStack);
redoBtn.onclick = () => restoreState(redoStack, undoStack);

// DIBUJO
function startPosition(e) {
    if (e.which === 1 || e.which === 3) {
        saveState();
        painting = true;
        context.beginPath();
        context.moveTo(
            e.clientX - canvas.offsetLeft,
            e.clientY - canvas.offsetTop
        );
    }
}

function endPosition() {
    painting = false;
    context.beginPath();
}

function draw(x, y) {
    context.lineWidth = brushSize.value;
    context.lineCap = "round";
    context.strokeStyle = colorPicker.value;
    context.lineTo(x - canvas.offsetLeft, y - canvas.offsetTop);
    context.stroke();
}

function drawEvent(e) {
    if (!painting) return;

    if (e.which === 1) {
        draw(e.clientX, e.clientY);
    }

    if (e.which === 3) {
        context.clearRect(
            e.clientX - canvas.offsetLeft,
            e.clientY - canvas.offsetTop,
            brushSize.value,
            brushSize.value
        );
    }
}

function clearCanvas() {
    saveState();
    context.clearRect(0, 0, canvas.width, canvas.height);
}

// EVENTOS
canvas.addEventListener("mousedown", startPosition);
canvas.addEventListener("mouseup", endPosition);
canvas.addEventListener("mousemove", drawEvent);
canvas.addEventListener("contextmenu", e => e.preventDefault());
clearButton.addEventListener("click", clearCanvas);

document.addEventListener("keydown", e => {
    if (e.ctrlKey && e.key === "z") restoreState(undoStack, redoStack);
    if (e.ctrlKey && e.key === "y") restoreState(redoStack, undoStack);
});
</script>

</body>
</html>
